apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-churn-api
  namespace: mlops
  labels:
    app: customer-churn-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-churn-api
  template:
    metadata:
      labels:
        app: customer-churn-api
      annotations:
        mlops/model-version: "1"
        mlops/run-id: "8842a9b53af044158d640d97436927c6"
        mlops/dataset-version: "v2"
        mlops/source-commit: "e6306bf499f0ca93fb27b7f9891385bf55739bec"
    spec:
      containers:
        - name: customer-churn-api
          image: ghcr.io/shaikhtousif1/customer-churn-api:e6306bf499f0ca93fb27b7f9891385bf55739bec
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
