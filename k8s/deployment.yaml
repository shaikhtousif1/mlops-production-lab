apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-churn-api
  namespace: mlops
  labels:
    app: customer-churn-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-churn-api
  template:
    metadata:
      labels:
        app: customer-churn-api
    spec:
      containers:
        - name: customer-churn-api
          image: ghcr.io/shaikhtousif1/customer-churn-api:7bf3015cea465c2e565bdd951ee358c1927230f2
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
