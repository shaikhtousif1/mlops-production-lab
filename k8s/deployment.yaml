apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-churn-api
  namespace: mlops
  labels:
    app: customer-churn-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-churn-api
  template:
    metadata:
      labels:
        app: customer-churn-api
      annotations:
        mlops/model-version: "1"
        mlops/run-id: "2d6d0f379b3a4f1ea75fbb2c3a137417"
        mlops/dataset-version: "v2"
        mlops/source-commit: "e6306bf499f0ca93fb27b7f9891385bf55739bec"
    spec:
      containers:
        - name: customer-churn-api
          image: ghcr.io/shaikhtousif1/customer-churn-api:5e1477c73659e6f7b09a1a2625298696615f2edb
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
