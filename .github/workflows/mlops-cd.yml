name: MLOps CD

on:
  workflow_run:
    workflows: ["MLOps CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Prepare Kubernetes manifest
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          MODEL_VERSION=$(python -c "import json; print(json.load(open('model_metadata.json'))['model_release_version'])")
          MODEL_RUN_ID=$(python -c "import json; print(json.load(open('model_metadata.json'))['run_id'])")
          DATASET_VERSION=$(python -c "import json; print(json.load(open('model_metadata.json'))['dataset_version'])")

          sed -i "s|ghcr.io/${{ github.repository_owner }}/customer-churn-api:.*|ghcr.io/${{ github.repository_owner }}/customer-churn-api:${IMAGE_TAG}|" k8s/deployment.yaml
          sed -i "s|mlops/model-version:.*|mlops/model-version: \"${MODEL_VERSION}\"|" k8s/deployment.yaml
          sed -i "s|mlops/run-id:.*|mlops/run-id: \"${MODEL_RUN_ID}\"|" k8s/deployment.yaml
          sed -i "s|mlops/dataset-version:.*|mlops/dataset-version: \"${DATASET_VERSION}\"|" k8s/deployment.yaml

          echo "Deployment lineage:"
          grep 'mlops/' k8s/deployment.yaml
          grep 'image:' k8s/deployment.yaml

      - name: Validate Kubernetes manifest
        run: |
          grep -q "ghcr.io/${{ github.repository_owner }}/customer-churn-api:${{ github.event.workflow_run.head_sha }}" k8s/deployment.yaml
          ! grep -qE 'IMAGE_TAG|MODEL_VERSION|MODEL_RUN_ID|DATASET_VERSION' k8s/deployment.yaml

      - name: Commit deployment manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes to commit."
          else
            git commit -m "Deploy release from CI ${{ github.event.workflow_run.head_sha }} [skip ci]"
            git push origin main
          fi
