name: MLOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python
        run: |
          python -m py_compile src/train.py
          python -m py_compile src/select_model.py
          python -m py_compile src/register_model.py
          python -m py_compile src/predict.py
          python -m py_compile src/api.py

      - name: Run tests
        run: |
          pytest -q

      - name: Run training
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python src/train.py --c 0.1

      - name: Run model quality gate
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python src/select_model.py

      - name: Register model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python src/register_model.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/customer-churn-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/customer-churn-api:latest
