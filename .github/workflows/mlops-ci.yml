name: MLOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python
        run: |
          python -m py_compile src/train.py
          python -m py_compile src/select_model.py
          python -m py_compile src/predict.py
          python -m py_compile src/api.py

      - name: Run training
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python src/train.py --c 0.1

      - name: Run model quality gate
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python src/select_model.py

      - name: Build API image
        run: |
          docker build -t customer-churn-api:${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker image inspect customer-churn-api:${{ github.sha }}