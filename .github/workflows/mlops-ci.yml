name: MLOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-train-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python
        run: |
          python -m py_compile src/train.py
          python -m py_compile src/select_model.py
          python -m py_compile src/register_model.py
          python -m py_compile src/promote_model.py
          python -m py_compile src/package_model.py
          python -m py_compile src/setup_mlflow.py
          python -m py_compile src/predict.py
          python -m py_compile src/api.py

      - name: Validate training data
        run: |
          python src/validate_data.py

      - name: Configure MLflow experiment and artifact store
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_DATABASE_URI }}
          MLFLOW_EXPERIMENT_NAME: customer-churn-ci
          MLFLOW_S3_ENDPOINT_URL: ${{ vars.MLFLOW_S3_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ vars.MLFLOW_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
        run: |
          python src/setup_mlflow.py

      - name: Run training
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_DATABASE_URI }}
          MLFLOW_EXPERIMENT_NAME: customer-churn-ci
          MLFLOW_S3_ENDPOINT_URL: ${{ vars.MLFLOW_S3_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ vars.MLFLOW_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          python src/train.py --c 0.5

      - name: Run model quality gate
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_DATABASE_URI }}
          MLFLOW_EXPERIMENT_NAME: customer-churn-ci
          MLFLOW_S3_ENDPOINT_URL: ${{ vars.MLFLOW_S3_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ vars.MLFOW_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          python src/select_model.py

      - name: Register model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_DATABASE_URI }}
          MLFLOW_EXPERIMENT_NAME: customer-churn-ci
          MLFLOW_S3_ENDPOINT_URL: ${{ vars.MLFLOW_S3_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ vars.MLFLOW_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          python src/register_model.py

      - name: Promote model to production
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_DATABASE_URI }}
        run: |
          python src/promote_model.py

      - name: Package and publish promoted model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_DATABASE_URI }}
          MLFLOW_S3_ENDPOINT_URL: ${{ vars.MLFLOW_S3_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ vars.MLFLOW_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID }}
        run: |
          python src/package_model.py

      - name: Run tests against packaged model
        run: |
          pytest -q

      - name: Upload release metadata for CD
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: model_metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/customer-churn-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/customer-churn-api:latest
