name: MLOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python
        run: |
          python -m py_compile src/train.py
          python -m py_compile src/select_model.py
          python -m py_compile src/register_model.py
          python -m py_compile src/predict.py
          python -m py_compile src/api.py

      - name: Run tests
        run: |
          pytest -q

      - name: Validate training data
        run: |
          python src/validate_data.py

      - name: Run training
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python src/train.py --c 0.1

      - name: Run model quality gate
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python src/select_model.py

      - name: Register model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python src/register_model.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/customer-churn-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/customer-churn-api:latest
      

      - name: Prepare Kubernetes manifest
        run: |
          sed -i "s/IMAGE_TAG/${{ github.sha }}/g" k8s/deployment.yaml


      - name: Commit Kubernetes manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes to commit."
          else
            git commit -m "Update image to ${{ github.sha }}"
            git push
          fi