name: MLOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python
        run: |
          python -m py_compile src/train.py
          python -m py_compile src/select_model.py
          python -m py_compile src/register_model.py
          python -m py_compile src/promote_model.py
          python -m py_compile src/package_model.py
          python -m py_compile src/predict.py
          python -m py_compile src/api.py

      - name: Validate training data
        run: |
          python src/validate_data.py

      - name: Run training
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python src/train.py --c 0.1

      - name: Run model quality gate
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python src/select_model.py

      - name: Register model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python src/register_model.py

      - name: Promote model to production
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python src/promote_model.py

      - name: Package and publish promoted model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID }}
          MODEL_ARTIFACT_VERSION: ${{ github.run_number }}
        run: |
          python src/package_model.py

      - name: Run tests against packaged model
        run: |
          pytest -q

      - name: Prepare Kubernetes manifest
        if: github.event_name == 'push'
        run: |
          MODEL_VERSION=$(python -c "import json; print(json.load(open('model_metadata.json'))['model_version'])")
          MODEL_RUN_ID=$(python -c "import json; print(json.load(open('model_metadata.json'))['run_id'])")
          DATASET_VERSION=$(python -c "import json; print(json.load(open('model_metadata.json'))['dataset_version'])")

          sed -i "s|ghcr.io/${{ github.repository_owner }}/customer-churn-api:.*|ghcr.io/${{ github.repository_owner }}/customer-churn-api:${{ github.sha }}|" k8s/deployment.yaml
          sed -i "s|mlops/model-version:.*|mlops/model-version: \"${MODEL_VERSION}\"|" k8s/deployment.yaml
          sed -i "s|mlops/run-id:.*|mlops/run-id: \"${MODEL_RUN_ID}\"|" k8s/deployment.yaml
          sed -i "s|mlops/dataset-version:.*|mlops/dataset-version: \"${DATASET_VERSION}\"|" k8s/deployment.yaml

          echo "Deployment lineage:"
          grep 'mlops/' k8s/deployment.yaml

      - name: Validate Kubernetes manifest
        if: github.event_name == 'push'
        run: |
          grep -q "ghcr.io/${{ github.repository_owner }}/customer-churn-api:${{ github.sha }}" k8s/deployment.yaml
          ! grep -qE 'IMAGE_TAG|MODEL_VERSION|MODEL_RUN_ID|DATASET_VERSION' k8s/deployment.yaml

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/customer-churn-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/customer-churn-api:latest

      - name: Commit Kubernetes manifest
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes to commit."
          else
            git commit -m "Update image and model lineage to ${{ github.sha }} [skip ci]"
            git push
          fi
